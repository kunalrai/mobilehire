<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunal Rai | Lead React Native Developer Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: var(--slate-800);
      line-height: 1.6;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .action-bar {
      background: var(--slate-900);
      color: var(--white);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .badge-status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
    }

    .btn-print {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-print:hover {
      background: var(--primary-dark);
    }

    .resume-body {
      padding: 40px 48px;
    }

    .header {
      border-bottom: 2px solid var(--slate-100);
      padding-bottom: 28px;
      margin-bottom: 30px;
    }

    .header-name {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--slate-900);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: 6px;
    }

    .contact-grid {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      font-size: 0.9rem;
      color: var(--slate-600);
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .contact-item a {
      color: var(--slate-700);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-item a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .contact-icon {
      width: 16px;
      height: 16px;
      stroke: var(--primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--slate-900);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--slate-200);
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    .summary-text {
      color: var(--slate-700);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .summary-text strong {
      color: var(--slate-900);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .skill-card {
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .skill-category {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--white);
      border: 1px solid var(--slate-200);
      color: var(--slate-700);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .tag.highlight {
      background: var(--primary-light);
      border-color: #bfdbfe;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .job-item {
      margin-bottom: 26px;
    }

    .job-item:last-child {
      margin-bottom: 0;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .job-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate-900);
    }

    .job-period {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--slate-500);
    }

    .job-company {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .job-client {
      color: var(--slate-600);
      font-weight: 500;
    }

    .job-bullets {
      list-style-type: none;
    }

    .job-bullets li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--slate-700);
      line-height: 1.6;
    }

    .job-bullets li::before {
      content: "▪";
      position: absolute;
      left: 2px;
      color: var(--primary);
      font-size: 1rem;
      top: -1px;
    }

    .job-bullets li strong {
      color: var(--slate-900);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .project-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      background: var(--white);
    }

    .project-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 6px;
    }

    .project-tech {
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .project-desc {
      font-size: 0.85rem;
      color: var(--slate-600);
      line-height: 1.5;
    }

    .dual-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .edu-item {
      font-size: 0.9rem;
    }

    .edu-degree {
      font-weight: 700;
      color: var(--slate-900);
    }

    .edu-meta {
      color: var(--slate-600);
      font-size: 0.85rem;
    }

    @media print {
      body {
        background: transparent;
        padding: 0;
        color: #000;
      }
      .container {
        box-shadow: none;
        border: none;
        max-width: 100%;
        margin: 0;
      }
      .action-bar {
        display: none !important;
      }
      .resume-body {
        padding: 0;
      }
      .section {
        margin-bottom: 20px;
        page-break-inside: avoid;
      }
      .btn-print {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .resume-body {
        padding: 24px 20px;
      }
      .header-name {
        font-size: 1.8rem;
      }
      .skills-grid, .projects-grid, .dual-col {
        grid-template-columns: 1fr;
      }
      .action-bar {
        padding: 10px 20px;
      }
    }
  </style>
</head>
